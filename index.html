    <style>
      /* Boot screen: paints instantly, before any JS is downloaded */
      html, body { background: #030204; margin: 0; }
      #boot {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(ellipse at 50% 55%, #0b1220 0%, #030204 65%);
        color: #fff; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
        transition: opacity .6s ease, visibility .6s;
      }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot .mark { font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
      #boot .mark span { color: #00e5ff; }
      #boot .bar { width: 140px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
      #boot .bar i {
        display: block; width: 40%; height: 100%;
        background: linear-gradient(90deg, transparent, #00e5ff, transparent);
        animation: boot-scan 1.1s ease-in-out infinite;
      }
      @keyframes boot-scan { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { #boot .bar i { animation: none; width: 100%; opacity: .5; } }
    </style>
</head>
<body>
    <div id="boot" aria-hidden="true">
      <div class="mark">sloboz<span>.dev</span></div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <noscript><p style="color:#fff;font-family:sans-serif;text-align:center;padding:2rem">This site needs JavaScript and WebGL.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
</body>
